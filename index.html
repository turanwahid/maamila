<!DOCTYPE html>
<html lang="fa-AF" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معامله — Maamila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1a56db;--blue-d:#1446b5;--blue-l:#e8effd;--saf:#f59e0b;--saf-l:#fff4dc;--green:#16a34a;--wa:#25d366;--red:#e11d48;
  --ink:#111827;--ink2:#4b5563;--ink3:#9ca3af;--line:#e5e7eb;--bg:#f4f5f7;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:clip}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-bottom:76px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.hide{display:none!important}

/* header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.hb{display:flex;align-items:center;gap:10px;height:62px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;color:var(--blue)}
.logo svg{width:34px;height:34px}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.pill:hover{border-color:var(--blue)}
.pill select{border:0;background:none;outline:none;font-weight:600;cursor:pointer;padding:0}
.postbtn{background:var(--blue);color:#fff;border-color:var(--blue)}
.postbtn:hover{background:var(--blue-d)}
.dnav{display:flex;gap:6px}

/* search + chips */
.hero{background:linear-gradient(135deg,#1a56db,#1e3a8a);color:#fff;padding:22px 0 26px}
.hero h1{margin:0 0 4px;font-size:24px;font-weight:900;line-height:1.5}
.hero p{margin:0 0 14px;opacity:.85;font-size:14px}
.sbox{display:flex;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.sbox input{flex:1;border:0;outline:0;height:52px;padding:0 16px;font-size:16px;color:var(--ink);min-width:0}
.sbox button{border:0;background:var(--saf);color:#111;font-weight:800;padding:0 20px;font-size:15px}
.cats{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:78px;font-size:12px;font-weight:600;text-align:center;line-height:1.4;background:none;border:0;padding:0}
.cat .ci{width:58px;height:58px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:28px;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cat.on .ci{border-color:var(--blue);background:var(--blue-l)}
.cat.on{color:var(--blue)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips select{height:36px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 10px;font-size:13.5px;font-weight:600}

/* feed */
.fh{display:flex;align-items:center;gap:8px;margin:10px 0}
.fh h2{margin:0;font-size:17px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.ad{background:#fff;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:.15s;position:relative}
.ad:hover{box-shadow:0 8px 24px rgba(0,0,0,.1)}
.ph{position:relative;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 35% 30%,hsl(var(--h) 85% 96%),hsl(var(--h) 60% 86%))}
.ph span{font-size:64px;line-height:1;filter:drop-shadow(0 6px 10px hsl(var(--h) 40% 30% / .25))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .tg{position:absolute;top:8px;inset-inline-start:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:2}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--ink);white-space:nowrap}
.tag.f{background:#1e3a8a;color:#fff}.tag.s{background:#0f766e;color:#fff}.tag.p{background:#fff;color:var(--ink)}
.tag.w{background:var(--saf);color:#111}
.tag.sold{background:var(--red);color:#fff}
.tag.demo{background:rgba(17,24,39,.65);color:#fff}
.ad .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.ad .tt{font-weight:600;font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:45px}
.ad .pr{font-weight:900;font-size:16px;margin-top:auto}
.ad .pr small{font-weight:500;font-size:12px;color:var(--ink2)}
.ad .mt{font-size:12px;color:var(--ink3)}
.heart{position:absolute;top:8px;inset-inline-end:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.95);font-size:17px;display:grid;place-items:center;color:var(--ink2)}
.heart.on{color:var(--red)}
.empty{text-align:center;padding:50px 16px;color:var(--ink2);background:#fff;border-radius:var(--r)}
.empty .e{font-size:52px}

/* buttons/forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.call{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.d{color:var(--red)}
.btn.blk{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:#fff;border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pad{padding:18px}
.fld{margin-bottom:16px}
.fld>label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.fld input[type=text],.fld input[type=tel],.fld input:not([type]),.fld select,.fld textarea{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:none;font-size:16px}
.fld textarea{height:auto;min-height:110px;padding:12px 14px;resize:vertical;line-height:1.8}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue)}
.fld .h{font-size:12.5px;color:var(--ink3);margin-top:4px}
.bad{border-color:var(--red)!important}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:700;font-size:13.5px;text-align:center;min-height:64px}
.seg label .i{font-size:22px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--wa)}
.phs{display:flex;gap:8px;flex-wrap:wrap}
.phs .th{width:96px;height:96px;border-radius:12px;overflow:hidden;position:relative;background:#eee}
.phs .th img{width:100%;height:100%;object-fit:cover}
.phs .th button{position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.phs .addp{width:96px;height:96px;border-radius:12px;border:2px dashed #c7cdd6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;background:#fafbfc}
.phs .addp b{font-size:28px;line-height:1;color:var(--blue)}

/* ad page */
.adp{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start;margin-top:14px}
.gal .main{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden}
.gal .main span{font-size:140px}
.gal .ths{display:flex;gap:8px;margin-top:8px}
.gal .ths button{width:70px;height:56px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:#eee}
.gal .ths button.on{border-color:var(--blue)}
.gal .ths img{width:100%;height:100%;object-fit:cover}
.info h1{font-size:21px;margin:0 0 4px;line-height:1.6}
.info .price{font-size:26px;font-weight:900;margin:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;margin:12px 0}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-weight:600}
.seller{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin:14px 0}
.av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;flex:none;background:linear-gradient(135deg,hsl(var(--h) 65% 50%),hsl(calc(var(--h) + 40) 65% 40%))}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:15px}
.num b{font-size:18px;letter-spacing:.5px}
.safe{background:var(--saf-l);border-radius:12px;padding:12px 14px;font-size:13px;margin-top:14px;color:#7a4b00}
.bc{font-size:13px;color:var(--ink3);margin-top:12px}

/* my ads */
.mine{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.mine:last-child{border:0}
.mine .ph{width:96px;flex:none;border-radius:10px}
.mine .ph span{font-size:36px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs a{height:40px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;font-weight:700;font-size:14px}
.tabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* bottom nav */
.bnav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:50;height:66px;padding-bottom:env(safe-area-inset-bottom)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink2);gap:1px}
.bnav a .i{font-size:21px}
.bnav a.on{color:var(--blue)}
.bnav a.plus .i{width:48px;height:48px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:28px;margin-top:-22px;box-shadow:0 6px 16px rgba(26,86,219,.4)}
footer{padding:26px 0 30px;color:var(--ink2);font-size:13px}
.g2f{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.drow{display:flex;align-items:center;gap:8px;margin:4px 0 6px;font-size:13.5px;font-weight:600}.drow select{flex:1;max-width:340px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 10px;font-size:14px}
.note{background:#fff;border-radius:12px;padding:12px 14px;margin-top:10px}
.terms h3{margin:18px 0 4px;font-size:16px}.terms p{margin:0 0 6px;color:var(--ink2);line-height:2}

/* overlays */
.mbg{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.mdl{background:#fff;border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:520px;max-height:80vh;overflow:auto;animation:up .2s}
@media(min-width:700px){.mbg{align-items:center}.mdl{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.mdl h3{margin:0 0 12px}
.clist button{display:flex;width:100%;align-items:center;gap:10px;padding:12px 10px;border:0;background:none;border-bottom:1px solid var(--line);font-size:15px;text-align:start}
.clist button.on{color:var(--blue);font-weight:800}
#toasts{position:fixed;bottom:86px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:100;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;animation:up .2s}
.toast.err{background:var(--red)}

@media(max-width:760px){
  .dnav{display:none}
  .bnav{display:flex}
  .adp{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .ph span{font-size:48px}
  .ad .bd{padding:8px 10px 10px}
  .ad .tt{font-size:13.5px}
  .hero h1{font-size:19px}
  .logo{font-size:20px}
  .hb{gap:6px}.pill{padding:0 9px;height:38px;font-size:13px}.logo{font-size:19px;gap:6px}.logo svg{width:30px;height:30px}
  .cityp{min-width:0;flex-shrink:1}.cityp .tx{display:inline-block;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .lpill .gl{display:none}
}
@media(min-width:761px){body{padding-bottom:0}}
</style>
</head>

function dataUrlToBlob(u){const [h,b]=u.split(',');const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'})}
async function upload(path,dataUrl){
  const {error}=await st.sb.storage.from(BUCKET).upload(path,dataUrlToBlob(dataUrl),{contentType:'image/jpeg',upsert:true,cacheControl:'31536000'});
  if(error)throw error;return st.sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function saveAd(id,ad,imgs,isNew){
  const uid=await ensureUser();const v=Date.now().toString(36);
  const urls=[];for(let i=0;i<imgs.length;i++){const im=imgs[i];urls.push(im.startsWith('data:')?await upload(`${uid}/${id}/${v}-${i}.jpg`,im):im)}
  let thumb=ad.thumbData?await upload(`${uid}/${id}/${v}-t.jpg`,ad.thumbData):(urls.length?ad.thumb||'':'');
  if(!urls.length)thumb='';
  const row={id,title:ad.title,cat:ad.cat,price:ad.price,stype:ad.stype,sale:ad.sale,city:ad.city,district:ad.district||'',descr:ad.desc,name:ad.name,phone:ad.phone,wa:ad.wa,images:urls,thumb,sold:!!ad.sold};
  const q=isNew?st.sb.from('ads').insert({...row,owner:uid}).select(COLS).single():st.sb.from('ads').update(row).eq('id',id).select(COLS).single();

async function cleanupPhotos(uid,id,keep){

function vTerms(){const d=TERMS[LANG];
  return `<div class="wrap" style="max-width:780px"><div class="card pad terms" style="margin-top:16px"><h1 style="font-size:22px;margin:0 0 4px">📜 ${d.title}</h1><div class="faint" style="font-size:13px;margin-bottom:12px">${d.upd}</div><p>${d.intro}</p>
  ${d.s.map(([h,b],i)=>`<h3>${num(i+1)}. ${h}</h3><p>${b}</p>`).join('')}
  <a class="btn p" href="#home" style="margin-top:8px">${t('back_home')}</a></div></div>`}

/* ===== router ===== */
const cur=()=>decodeURIComponent((location.hash||'#home').slice(1))||'home';
let last='';
function route(soft){
  const r=cur();const sy=window.scrollY;
  if(r!==last&&!/^(post|edit-)/.test(r))st.draft=null;
  let h;
  if(r.startsWith('ad-'))h=vAd(r.slice(3));else if(r==='post')h=vPost();else if(r.startsWith('edit-'))h=vPost(r.slice(5));
  else if(r==='mine')h=vMine();else if(r==='saved')h=vSaved();else if(r==='terms')h=vTerms();else h=vHome();
  document.getElementById('app').innerHTML=h;renderChrome();
  if(r!==last)window.scrollTo(0,0);else if(soft)window.scrollTo(0,sy);
  last=r;
  if(r.startsWith('ad-'))loadGallery(adById(r.slice(3)));
  if(document.getElementById('phs'))drawPhotos();
}
window.addEventListener('hashchange',()=>route());

/* ===== events ===== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='mclose'){if(e.target===a||a.tagName==='BUTTON')modal('');return}
  if(act==='save'){e.preventDefault();e.stopPropagation();const s=new Set(st.me.saved);const on=!s.has(a.dataset.id);on?s.add(a.dataset.id):s.delete(a.dataset.id);st.me.saved=[...s];saveMe();
    document.querySelectorAll(`[data-act=save][data-id="${a.dataset.id}"]`).forEach(b=>{b.classList.toggle('on',on);b.textContent=on?'♥':'♡'});toast(on?t('saved_ok'):t('unsaved'));if(cur()==='saved')route(true);return}
  if(act==='cat'){e.preventDefault();st.cat=a.dataset.id;if(cur()!=='home')location.hash='#home';else route(true);return}
  if(act==='stype'){st.stype=a.dataset.k;route(true);return}
  if(act==='city'){modal(`<h3>${t('choose_city')}</h3><div class="clist">${[['all',M(t('all_af'))],...CITIES].map(([k,n])=>`<button data-act="setcity" data-k="${k}" class="${st.city===k?'on':''}">📍 ${L(n)}</button>`).join('')}</div>`);return}
  if(act==='setcity'){st.city=a.dataset.k;st.district='';LS.set('city',st.city);modal('');if(cur()!=='home')location.hash='#home';else route(true);return}
  if(act==='copy'){const p=a.dataset.p;(navigator.clipboard?navigator.clipboard.writeText(latinDigits(p)):Promise.reject()).then(()=>toast(t('copied'))).catch(()=>toast(p));return}
  if(act==='rmimg'){st.draft.imgs.splice(+a.dataset.i,1);drawPhotos();return}
  if(act==='sold'){const ad=st.ads.find(x=>x.id===a.dataset.id&&x.owner===st.uid);if(ad)setSold(ad,!ad.sold).then(()=>route(true)).catch(()=>{});return}
  if(act==='del'){const id=a.dataset.id;modal(`<h3>${t('confirm_del')}</h3><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-act="mclose">${t('cancel')}</button><button class="btn p" id="mok" style="background:var(--red);border-color:var(--red)">${t('del')}</button></div>`);
    document.getElementById('mok').onclick=async()=>{modal('');try{await delAd(id);toast(t('deleted'));if(cur().startsWith('ad-'))location.hash='#mine';else route(true)}catch(_){}};return}
});
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('bad'))e.target.classList.remove('bad')});
document.addEventListener('change',e=>{
  if(e.target.classList&&e.target.classList.contains('bad'))e.target.classList.remove('bad');
  const el=e.target;
  if(el.id==='langsel'){LANG=el.value;try{localStorage.setItem('bzk:lang',LANG)}catch(_){}route(true);return}
  if(el.id==='sortsel'){st.sort=el.value;route(true);return}
  if(el.id==='distsel'){st.district=el.value;route(true);return}
  if(el.name==='city'&&el.form&&el.form.id==='postform'){const ds=el.form.elements.district;ds.innerHTML=distOptions(el.value,'');ds.classList.remove('bad');return}
  if(el.id==='pfile'){const files=[...el.files];el.value='';if(!st.draft)return;
    const room=3-st.draft.imgs.length;if(files.length>room)toast(t('max3'));
    files.slice(0,Math.max(0,room)).forEach(f=>resize(f,900,60000).then(u=>{if(st.draft.imgs.length<3){st.draft.imgs.push(u);drawPhotos()}}));return}
  if(el.name==='stype'&&st.draft)st.draft.stype=el.value;
  if(el.name==='sale'&&st.draft)st.draft.sale=el.value;
});
function resize(src,max,budget){return new Promise((res,rej)=>{
  const go=url=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
    let q=.8,u=cv.toDataURL('image/jpeg',q);while(u.length>budget*1.37&&q>.35){q-=.1;u=cv.toDataURL('image/jpeg',q)}res(u)};im.onerror=rej;im.src=url};
  if(typeof src==='string')go(src);else{const fr=new FileReader();fr.onload=()=>go(fr.result);fr.onerror=rej;fr.readAsDataURL(src)}})}
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='sform'){st.q=document.getElementById('sq').value;document.getElementById('sq').blur();route(true);
    setTimeout(()=>document.querySelector('.fh')?.scrollIntoView({behavior:'smooth',block:'start'}),50);return}
  if(f.id==='postform'){
    const fd=Object.fromEntries(new FormData(f).entries());let ok=true;
    ['title','cat','city','district','name','phone'].forEach(n=>{const bad=!String(fd[n]||'').trim();f.elements[n].classList.toggle('bad',bad);if(bad)ok=false});
    const digits=latinDigits(fd.phone||'').replace(/\D/g,'');if(digits.length<9){f.elements.phone.classList.add('bad');ok=false}
    if(!ok){toast(t('fill'),1);f.querySelector('.bad')?.scrollIntoView({behavior:'smooth',block:'center'});return}
    const editId=cur().startsWith('edit-')?cur().slice(5):null;const ex=editId&&st.ads.find(x=>x.id===editId&&x.owner===st.uid);
    const d=st.draft;const btn=f.querySelector('button.p');btn.disabled=true;
    try{
      const id=ex?ex.id:crypto.randomUUID();
      const first=d.imgs[0]||'';const thumbData=first.startsWith('data:')?await resize(first,420,22000):'';
      const keepThumb=!first?'':(ex&&first===ex.images[0]?ex.thumb:first);
      const ad={title:fd.title.trim().slice(0,90),cat:fd.cat,price:toNum(fd.price),stype:d.stype||'person',sale:d.sale||'retail',city:fd.city,district:(fd.district||'').slice(0,60),desc:(fd.desc||'').trim().slice(0,1500),
        name:fd.name.trim().slice(0,60),phone:latinDigits(fd.phone).trim().slice(0,16),wa:!!fd.wa,thumb:keepThumb,thumbData,sold:ex?ex.sold:false};
      await saveAd(id,ad,d.imgs,!ex);
      st.me={...st.me,name:ad.name,phone:ad.phone,wa:ad.wa,city:ad.city,district:ad.district,stype:ad.stype};saveMe();
      st.draft=null;toast(ex?t('updated'):t('published'));location.hash='#ad-'+id;
    }catch(err){console.error(err);toast(t('save_err'),1);btn.disabled=false}
  }
});

route();
initDb();
