<!doctype html>
<html lang="fa-AF" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>معامله — Maamila</title>
    <!-- installable app: manifest, icons and the service worker registered in js/app.js -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1a56db" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="معامله" />
    <!-- how links to the site look when shared (Facebook, WhatsApp, Telegram, X); image in social/ -->
    <meta name="description" content="معامله — بخرید و بفروشید، مستقیم از فابریکه، دوکان و مردم. اعلان رایگان، تماس مستقیم با فروشنده." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="معامله — Maamila" />
    <meta property="og:title" content="معامله — بخرید و بفروشید" />
    <meta property="og:description" content="مستقیم از فابریکه، دوکان و مردم. اعلان رایگان، تماس مستقیم با فروشنده." />
    <meta property="og:url" content="https://maamila.com/" />
    <meta property="og:image" content="https://maamila.com/social/share-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fa_AF" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <!-- Supabase library, pinned to one version; "integrity" makes the browser refuse a changed file.
         To upgrade: change the version here and in _headers, and put in the new file's sha384 hash. -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
      integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header><div class="wrap hb" id="hdr"></div></header>
    <main id="app"></main>
    <footer id="ftr"></footer>
    <nav class="bnav" id="bnav"></nav>
    <div id="modal"></div>
    <div id="toasts"></div>
    <input type="file" id="pfile" accept="image/*" multiple hidden />

    <script src="lang/dr.js"></script>
    <script src="lang/ps.js"></script>
    <script src="lang/uz.js"></script>
    <script src="lang/en.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
